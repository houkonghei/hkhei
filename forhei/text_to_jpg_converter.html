<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文字轉 JPG 圖片生成器</title>
    <!-- Tailwind CSS for modern UI design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        /* Custom scrollbar styling */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 py-4 px-6 shadow-sm">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-indigo-600 text-white rounded-lg shadow">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900">文字轉 JPG 圖片生成器</h1>
                    <p class="text-xs text-slate-500">輸入文字、調整樣式，一鍵下載高畫質 JPG 圖片</p>
                </div>
            </div>
            <span class="px-3 py-1 bg-indigo-50 text-indigo-700 text-xs font-semibold rounded-full border border-indigo-200">本地離線可用</span>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- Control Panel (Left Column) -->
        <section class="lg:col-span-5 bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col space-y-5 overflow-y-auto max-h-[calc(100vh-120px)]">
            <h2 class="text-lg font-bold text-slate-800 border-b pb-2 flex items-center justify-between">
                <span>控制面板</span>
                <button id="resetBtn" class="text-xs text-slate-500 hover:text-indigo-600 underline transition">重置設定</button>
            </h2>

            <!-- Text Input Area -->
            <div>
                <label for="textInput" class="block text-sm font-semibold text-slate-700 mb-1">文字內容</label>
                <textarea id="textInput" rows="4" class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition resize-none text-slate-800" placeholder="請在此輸入要生成圖片的文字...">你好，世界！
這是一張由網頁生成的文字圖片。
點擊下方按鈕即可匯出為高畫質 JPG。</textarea>
            </div>

            <!-- Font Options Grid -->
            <div class="grid grid-cols-2 gap-4">
                <!-- Font Size -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label for="fontSize" class="text-sm font-semibold text-slate-700">字體大小</label>
                        <span id="fontSizeValue" class="text-xs text-indigo-600 font-bold">48 px</span>
                    </div>
                    <input type="range" id="fontSize" min="16" max="120" value="48" class="w-full accent-indigo-600 cursor-pointer">
                </div>

                <!-- Line Height -->
                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label for="lineHeight" class="text-sm font-semibold text-slate-700">行高</label>
                        <span id="lineHeightValue" class="text-xs text-indigo-600 font-bold">1.4</span>
                    </div>
                    <input type="range" id="lineHeight" min="1.0" max="2.5" step="0.1" value="1.4" class="w-full accent-indigo-600 cursor-pointer">
                </div>
            </div>

            <!-- Font Style & Alignment -->
            <div class="grid grid-cols-2 gap-4">
                <!-- Font Family -->
                <div>
                    <label for="fontFamily" class="block text-sm font-semibold text-slate-700 mb-1">字型風格</label>
                    <select id="fontFamily" class="w-full p-2.5 border border-slate-300 rounded-xl bg-white focus:ring-2 focus:ring-indigo-500 text-sm">
                        <option value="'Noto Sans TC', sans-serif">無襯線黑體 (Sans-Serif)</option>
                        <option value="'Noto Serif TC', serif">襯線宋體 (Serif)</option>
                        <option value="KaiTi, STKaiti, serif">標楷體 (Kaiti)</option>
                        <option value="monospace">等寬字型 (Monospace)</option>
                    </select>
                </div>

                <!-- Text Align -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">對齊方式</label>
                    <div class="grid grid-cols-3 gap-1 bg-slate-100 p-1 rounded-xl">
                        <button type="button" data-align="left" class="align-btn py-1.5 rounded-lg text-xs font-semibold text-slate-600 hover:bg-white transition text-center">靠左</button>
                        <button type="button" data-align="center" class="align-btn active-align py-1.5 rounded-lg text-xs font-semibold bg-white text-indigo-600 shadow-sm text-center">居中</button>
                        <button type="button" data-align="right" class="align-btn py-1.5 rounded-lg text-xs font-semibold text-slate-600 hover:bg-white transition text-center">靠右</button>
                    </div>
                </div>
            </div>

            <!-- Color Options -->
            <div class="grid grid-cols-2 gap-4">
                <!-- Text Color -->
                <div>
                    <label for="textColor" class="block text-sm font-semibold text-slate-700 mb-1">文字顏色</label>
                    <div class="flex items-center space-x-2">
                        <input type="color" id="textColor" value="#1e293b" class="w-10 h-10 border-0 rounded-lg cursor-pointer bg-transparent">
                        <input type="text" id="textColorHex" value="#1e293b" class="w-full p-2 text-xs border border-slate-300 rounded-lg uppercase">
                    </div>
                </div>

                <!-- Background Color -->
                <div>
                    <label for="bgColor" class="block text-sm font-semibold text-slate-700 mb-1">背景顏色</label>
                    <div class="flex items-center space-x-2">
                        <input type="color" id="bgColor" value="#f8fafc" class="w-10 h-10 border-0 rounded-lg cursor-pointer bg-transparent">
                        <input type="text" id="bgColorHex" value="#f8fafc" class="w-full p-2 text-xs border border-slate-300 rounded-lg uppercase">
                    </div>
                </div>
            </div>

            <!-- Preset Colors Palette -->
            <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1.5">快速顏色組合</label>
                <div class="flex flex-wrap gap-2">
                    <button type="button" class="preset-theme px-3 py-1.5 rounded-lg text-xs border border-slate-200 bg-white text-slate-800 shadow-xs hover:scale-105 transition" data-text="#1e293b" data-bg="#ffffff">極簡白</button>
                    <button type="button" class="preset-theme px-3 py-1.5 rounded-lg text-xs border border-slate-800 bg-slate-900 text-white shadow-xs hover:scale-105 transition" data-text="#ffffff" data-bg="#0f172a">暗黑夜</button>
                    <button type="button" class="preset-theme px-3 py-1.5 rounded-lg text-xs bg-amber-50 text-amber-900 border border-amber-200 shadow-xs hover:scale-105 transition" data-text="#78350f" data-bg="#fef3c7">暖陽黃</button>
                    <button type="button" class="preset-theme px-3 py-1.5 rounded-lg text-xs bg-emerald-900 text-emerald-100 border border-emerald-800 shadow-xs hover:scale-105 transition" data-text="#ecfdf5" data-bg="#064e3b">森林綠</button>
                    <button type="button" class="preset-theme px-3 py-1.5 rounded-lg text-xs bg-purple-100 text-purple-900 border border-purple-200 shadow-xs hover:scale-105 transition" data-text="#581c87" data-bg="#f3e8ff">夢幻紫</button>
                </div>
            </div>

            <!-- Image Size & Padding -->
            <div class="border-t border-slate-100 pt-4 space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <!-- Aspect Ratio / Dimension Preset -->
                    <div>
                        <label for="aspectRatio" class="block text-sm font-semibold text-slate-700 mb-1">畫布尺寸</label>
                        <select id="aspectRatio" class="w-full p-2.5 border border-slate-300 rounded-xl bg-white focus:ring-2 focus:ring-indigo-500 text-sm">
                            <option value="auto">自動適應內容</option>
                            <option value="1:1">正方形 (1:1 - 800x800)</option>
                            <option value="16:9">橫向 (16:9 - 960x540)</option>
                            <option value="9:16">直向卡片 (9:16 - 540x960)</option>
                        </select>
                    </div>

                    <!-- Padding -->
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <label for="padding" class="text-sm font-semibold text-slate-700">邊距 (Padding)</label>
                            <span id="paddingValue" class="text-xs text-indigo-600 font-bold">60 px</span>
                        </div>
                        <input type="range" id="padding" min="20" max="150" value="60" class="w-full accent-indigo-600 cursor-pointer">
                    </div>
                </div>
            </div>

            <!-- Download Button -->
            <div class="pt-2">
                <button id="downloadBtn" class="w-full py-3.5 px-4 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold rounded-xl shadow-lg shadow-indigo-200 transition-all transform hover:-translate-y-0.5 flex items-center justify-center space-x-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    <span>匯出並下載 JPG 圖片</span>
                </button>
            </div>
        </section>

        <!-- Live Preview Area (Right Column) -->
        <section class="lg:col-span-7 bg-slate-200/70 p-6 rounded-2xl border border-slate-300/80 flex flex-col justify-center items-center overflow-hidden relative min-h-[400px]">
            <div class="absolute top-4 left-4 text-xs font-semibold text-slate-500 bg-white/80 backdrop-blur px-3 py-1 rounded-full shadow-xs">
                即時預覽區
            </div>

            <!-- Scrollable Canvas Wrapper -->
            <div class="w-full h-full flex items-center justify-center overflow-auto p-4 max-h-[calc(100vh-180px)]">
                <!-- Canvas Element -->
                <canvas id="textCanvas" class="shadow-2xl rounded-lg max-w-full h-auto transition-all bg-white"></canvas>
            </div>

            <!-- Toast Alert for Notifications -->
            <div id="toast" class="hidden absolute bottom-6 bg-slate-900/90 text-white text-xs px-4 py-2.5 rounded-lg shadow-xl backdrop-blur transition-all flex items-center space-x-2">
                <svg class="w-4 h-4 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                </svg>
                <span id="toastMsg">已成功匯出圖片！</span>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-3 text-center text-xs text-slate-500">
        HTML5 Canvas 本地高畫質圖片轉換器 • 無需要上傳資料，保護個人隱私
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // DOM Elements
            const canvas = document.getElementById("textCanvas");
            const ctx = canvas.getContext("2d");
            
            const textInput = document.getElementById("textInput");
            const fontSizeInput = document.getElementById("fontSize");
            const fontSizeValue = document.getElementById("fontSizeValue");
            const lineHeightInput = document.getElementById("lineHeight");
            const lineHeightValue = document.getElementById("lineHeightValue");
            const fontFamilySelect = document.getElementById("fontFamily");
            const textColorInput = document.getElementById("textColor");
            const textColorHex = document.getElementById("textColorHex");
            const bgColorInput = document.getElementById("bgColor");
            const bgColorHex = document.getElementById("bgColorHex");
            const aspectRatioSelect = document.getElementById("aspectRatio");
            const paddingInput = document.getElementById("padding");
            const paddingValue = document.getElementById("paddingValue");
            const downloadBtn = document.getElementById("downloadBtn");
            const resetBtn = document.getElementById("resetBtn");
            const alignBtns = document.querySelectorAll(".align-btn");
            const presetBtns = document.querySelectorAll(".preset-theme");
            const toast = document.getElementById("toast");
            const toastMsg = document.getElementById("toastMsg");

            // State Management
            let currentAlign = "center";

            /**
             * Text Wrapping Algorithm supporting CJK and multi-line breaks
             */
            function getWrappedLines(context, text, maxWidth) {
                const lines = [];
                const rawLines = text.split("\n");

                for (let r = 0; r < rawLines.length; r++) {
                    const line = rawLines[r];
                    if (line === "") {
                        lines.push("");
                        continue;
                    }

                    let currentLine = "";
                    // Iterate character by character to correctly handle Chinese/Japanese/Korean and English
                    for (let i = 0; i < line.length; i++) {
                        const char = line[i];
                        const testLine = currentLine + char;
                        const metrics = context.measureText(testLine);

                        if (metrics.width > maxWidth && i > 0) {
                            lines.push(currentLine);
                            currentLine = char;
                        } else {
                            currentLine = testLine;
                        }
                    }
                    if (currentLine) {
                        lines.push(currentLine);
                    }
                }
                return lines;
            }

            /**
             * Main Render Function
             */
            function render() {
                const text = textInput.value || " ";
                const fontSize = parseInt(fontSizeInput.value, 10);
                const lineHeightMultiplier = parseFloat(lineHeightInput.value);
                const fontFamily = fontFamilySelect.value;
                const textColor = textColorInput.value;
                const bgColor = bgColorInput.value;
                const padding = parseInt(paddingInput.value, 10);
                const aspect = aspectRatioSelect.value;

                // Update Display Text
                fontSizeValue.textContent = `${fontSize} px`;
                lineHeightValue.textContent = lineHeightMultiplier.toFixed(1);
                paddingValue.textContent = `${padding} px`;

                // Calculate Canvas Scale for High-DPI (Retina) crisp display
                const scale = 2; // Render at 2x resolution for sharpness

                // Prepare context settings to measure text accurately
                const fontSpec = `bold ${fontSize}px ${fontFamily}`;
                ctx.font = fontSpec;

                const lineHeight = fontSize * lineHeightMultiplier;

                // Base width/height calculation
                let targetWidth = 800;
                let targetHeight = 600;

                if (aspect === "auto") {
                    // Calculate automatic layout based on text measurement
                    const maxTextWidthLimit = 700; 
                    const dummyCanvas = document.createElement("canvas");
                    const dummyCtx = dummyCanvas.getContext("2d");
                    dummyCtx.font = fontSpec;

                    const wrappedLines = getWrappedLines(dummyCtx, text, maxTextWidthLimit);

                    let longestLineWidth = 0;
                    wrappedLines.forEach(line => {
                        const w = dummyCtx.measureText(line).width;
                        if (w > longestLineWidth) longestLineWidth = w;
                    });

                    targetWidth = Math.max(400, Math.ceil(longestLineWidth + padding * 2));
                    targetHeight = Math.ceil(wrappedLines.length * lineHeight + padding * 2);
                } else if (aspect === "1:1") {
                    targetWidth = 800;
                    targetHeight = 800;
                } else if (aspect === "16:9") {
                    targetWidth = 960;
                    targetHeight = 540;
                } else if (aspect === "9:16") {
                    targetWidth = 540;
                    targetHeight = 960;
                }

                // Apply Scale to Canvas
                canvas.width = targetWidth * scale;
                canvas.height = targetHeight * scale;

                // CSS display size
                canvas.style.width = `${targetWidth}px`;
                canvas.style.height = `${targetHeight}px`;

                // Scale context
                ctx.save();
                ctx.scale(scale, scale);

                // Draw Background
                ctx.fillStyle = bgColor;
                ctx.fillRect(0, 0, targetWidth, targetHeight);

                // Prepare Text Options
                ctx.font = fontSpec;
                ctx.fillStyle = textColor;
                ctx.textBaseline = "middle";

                const maxLineWidth = targetWidth - padding * 2;
                const lines = getWrappedLines(ctx, text, maxLineWidth);
                const totalTextHeight = lines.length * lineHeight;

                // Y Starting position (Vertical Center)
                let startY = (targetHeight - totalTextHeight) / 2 + lineHeight / 2;

                // X position and Canvas Text Alignment
                let startX = padding;
                if (currentAlign === "center") {
                    startX = targetWidth / 2;
                    ctx.textAlign = "center";
                } else if (currentAlign === "right") {
                    startX = targetWidth - padding;
                    ctx.textAlign = "right";
                } else {
                    ctx.textAlign = "left";
                }

                // Render each line
                lines.forEach((line, index) => {
                    const currentY = startY + index * lineHeight;
                    ctx.fillText(line, startX, currentY);
                });

                ctx.restore();
            }

            /**
             * Toast Notification Trigger
             */
            function showToast(message) {
                toastMsg.textContent = message;
                toast.classList.remove("hidden");
                setTimeout(() => {
                    toast.classList.add("hidden");
                }, 2500);
            }

            /**
             * Download Canvas as JPG
             */
            function downloadImage() {
                try {
                    // Convert canvas to JPG data URL with maximum quality (0.95)
                    const imageURI = canvas.toDataURL("image/jpeg", 0.95);
                    
                    // Trigger download link
                    const link = document.createElement("a");
                    const timeStamp = new Date().toISOString().slice(0,10);
                    link.download = `Text_Image_${timeStamp}.jpg`;
                    link.href = imageURI;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    showToast("圖片已成功下載至您的電腦！");
                } catch (e) {
                    console.error(e);
                    showToast("匯出失敗，請重試！");
                }
            }

            // Event Listeners for Live Updates
            textInput.addEventListener("input", render);
            fontSizeInput.addEventListener("input", render);
            lineHeightInput.addEventListener("input", render);
            fontFamilySelect.addEventListener("change", render);
            paddingInput.addEventListener("input", render);
            aspectRatioSelect.addEventListener("change", render);

            // Color inputs syncing with hex code text inputs
            textColorInput.addEventListener("input", (e) => {
                textColorHex.value = e.target.value.toUpperCase();
                render();
            });
            textColorHex.addEventListener("input", (e) => {
                if (/^#[0-9A-F]{6}$/i.test(e.target.value)) {
                    textColorInput.value = e.target.value;
                    render();
                }
            });

            bgColorInput.addEventListener("input", (e) => {
                bgColorHex.value = e.target.value.toUpperCase();
                render();
            });
            bgColorHex.addEventListener("input", (e) => {
                if (/^#[0-9A-F]{6}$/i.test(e.target.value)) {
                    bgColorInput.value = e.target.value;
                    render();
                }
            });

            // Alignment Buttons
            alignBtns.forEach(btn => {
                btn.addEventListener("click", () => {
                    alignBtns.forEach(b => {
                        b.classList.remove("active-align", "bg-white", "text-indigo-600", "shadow-sm");
                        b.classList.add("text-slate-600");
                    });
                    btn.classList.add("active-align", "bg-white", "text-indigo-600", "shadow-sm");
                    btn.classList.remove("text-slate-600");
                    currentAlign = btn.getAttribute("data-align");
                    render();
                });
            });

            // Preset Themes
            presetBtns.forEach(btn => {
                btn.addEventListener("click", () => {
                    const textC = btn.getAttribute("data-text");
                    const bgC = btn.getAttribute("data-bg");

                    textColorInput.value = textC;
                    textColorHex.value = textC.toUpperCase();
                    bgColorInput.value = bgC;
                    bgColorHex.value = bgC.toUpperCase();

                    render();
                });
            });

            // Download Trigger
            downloadBtn.addEventListener("click", downloadImage);

            // Reset Settings
            resetBtn.addEventListener("click", () => {
                textInput.value = "你好，世界！\n這是一張由網頁生成的文字圖片。\n點擊下方按鈕即可匯出為高畫質 JPG。";
                fontSizeInput.value = 48;
                lineHeightInput.value = 1.4;
                fontFamilySelect.value = "'Noto Sans TC', sans-serif";
                textColorInput.value = "#1e293b";
                textColorHex.value = "#1E293B";
                bgColorInput.value = "#f8fafc";
                bgColorHex.value = "#F8FAFC";
                aspectRatioSelect.value = "auto";
                paddingInput.value = 60;
                currentAlign = "center";

                alignBtns.forEach(b => {
                    if (b.getAttribute("data-align") === "center") {
                        b.classList.add("active-align", "bg-white", "text-indigo-600", "shadow-sm");
                    } else {
                        b.classList.remove("active-align", "bg-white", "text-indigo-600", "shadow-sm");
                        b.classList.add("text-slate-600");
                    }
                });

                render();
            });

            // Initial Render on Load
            render();
        });
    </script>
</body>
</html>
